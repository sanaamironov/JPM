add_newline = true

format = """
$username$hostname$directory$git_branch$git_status$python$conda$nodejs$cmd_duration
$character
"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[directory]
style = "bold blue"
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = "git "
style = "bold purple"

[git_status]
style = "red"

[python]
symbol = "py "
style = "yellow"

[conda]
symbol = "conda "
style = "green"
ignore_base = false

[nodejs]
symbol = "node "
style = "green"

[cmd_duration]
min_time = 1000
format = "took [$duration](bold yellow)"
